# Companies InternRadar watches.
#
# This file only SEEDS the database: from Phase 2 on, new entries here are added
# to the companies table, but existing rows are never overwritten (so toggles you
# flip in the dashboard stick). To add a company, run:
#   cd worker && py detect_ats.py <careers_url>
# and paste the snippet it prints.
#
# Fields:
#   ats:            greenhouse | lever | ashby | smartrecruiters | workday | html
#   id:             board token / slug / company id / Workday tenant
#   workday_dc:     the N in {tenant}.wd{N}.myworkdayjobs.com   (workday only)
#   workday_site:   the path after the domain, e.g. "External"  (workday only)
#   workday_search: optional search text so we don't page through thousands of global jobs
#   html_selectors: CSS selectors for custom pages (html only, see CONTRIBUTING.md)
#
# All entries below were checked against the live API on 2026-10-27.

